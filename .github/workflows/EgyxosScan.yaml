name: Egyxos Scanner Automation

on:
  workflow_dispatch: # Allows you to run it manually
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install Recon Tools
        run: |
          sudo apt-get install nmap
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          echo "/home/runner/go/bin" >> $GITHUB_PATH

      - name: Run Subfinder
        run: subfinder -d google.com -o subdomains.txt # Replace google.com with your target

      - name: Process Results
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/egyxos_logic.py

      - name: Update History
        run: |
          cp subdomains.txt subdomains_history.txt
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add subdomains_history.txt
          git commit -m "Update subdomain history [skip ci]" || echo "No changes"
          git push
