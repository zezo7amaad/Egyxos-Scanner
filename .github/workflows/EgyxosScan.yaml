name: Egyxos Scanner

on:
  workflow_dispatch:
    inputs:
      target_domain:
        description: 'Target domain to scan (e.g., example.com)'
        required: true
        default: ''
  schedule:
    - cron: '0 */12 * * *' # Automated run every 12 hours

jobs:
  recon-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: false

      - name: Notify Discord (Scan Started)
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -H "Content-Type: application/json" -X POST -d '{
            "username": "ReconGL",
            "content": "🔍 **Scan Started**\n**Domain:** ${{ github.event.inputs.target_domain }}\n**Trigger:** workflow_dispatch\n**Tools:** Subfinder\n**Action Link:** '"$RUN_URL"'"
          }' "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Install Security Tools
        run: |
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          echo "/home/runner/go/bin" >> $GITHUB_PATH

      # --- 1. SUBFINDER ---
      - name: Subdomain Discovery
        id: subfinder
        run: |
          subfinder -d ${{ github.event.inputs.target_domain }} -o subdomains.txt || touch subdomains.txt
          if [ -s subdomains.txt ]; then
            echo "count=$(wc -l < subdomains.txt)" >> $GITHUB_OUTPUT
          else
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      - name: Notify Discord (Subfinder)
        if: steps.subfinder.outputs.count > 0
        run: |
          # Formatting the list to look like the video: \n before each domain inside a code block
          LIST=$(cat subdomains.txt | sed 's/"/\\"/g' | tr '\n' '\\n')
          curl -H "Content-Type: application/json" -X POST -d '{
            "username": "ReconGL",
            "content": "✅ **Subfinder Complete**\\n**Domain:** ${{ github.event.inputs.target_domain }}\\n**Subdomains Found:** ${{ steps.subfinder.outputs.count }}\\n\\n```\\n'"$LIST"'\\n```"
          }' "${{ secrets.DISCORD_WEBHOOK }}"

      # --- 2. FINAL REPORT ---
      - name: Send Final Report
        if: always()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SUB_COUNT=$([ -f subdomains.txt ] && wc -l < subdomains.txt || echo "0")
          
          curl -H "Content-Type: application/json" -X POST -d '{
            "username": "ReconGL",
            "content": "🏁 **Subdomain Scan Finished**\n**Target:** ${{ github.event.inputs.target_domain }}\n**Total Subdomains:** '"$SUB_COUNT"'\n\n📥 **Access Results:** [Download Artifacts]('"$RUN_URL"')"
          }' "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Egyxos-Subdomains-${{ github.event.inputs.target_domain }}
          path: subdomains.txt
