name: Egyxos Authorized Scan

on:
  workflow_dispatch:
    inputs:
      target_domain:
        description: "Hostname or URL you own or are authorized to test"
        required: true
        type: string
      profile:
        description: "Scan profile"
        required: true
        default: "passive"
        type: choice
        options:
          - passive
          - standard
          - deep
      format:
        description: "Primary report format"
        required: true
        default: "sarif"
        type: choice
        options:
          - json
          - html
          - sarif
          - csv
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: ${{ inputs.target_domain || vars.EGYXOS_TARGET }}
      PROFILE: ${{ inputs.profile || vars.EGYXOS_PROFILE || 'passive' }}
      FORMAT: ${{ inputs.format || 'sarif' }}
    steps:
      - name: Validate configured target
        run: |
          test -n "$TARGET" || {
            echo "::error::Set the target_domain input or the EGYXOS_TARGET repository variable."
            exit 2
          }

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Egyxos
        run: python -m pip install .

      - name: Install passive toolchain
        if: env.PROFILE == 'passive'
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap

      - name: Install standard toolchain
        if: env.PROFILE == 'standard' || env.PROFILE == 'deep'
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/katana/cmd/katana@latest
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest

      - name: Run authorized Egyxos scan
        run: |
          mkdir -p online-results
          egyxos scan "$TARGET" \
            --yes-i-am-authorized \
            --profile "$PROFILE" \
            --format "$FORMAT" \
            --output-dir online-results

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egyxos-${{ github.run_number }}
          path: online-results/
          if-no-files-found: warn
          retention-days: 14
