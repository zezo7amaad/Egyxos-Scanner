name: Egyxos Scanner

on:
  workflow_dispatch:
    inputs:
      target_domain:
        description: 'Target domain to scan (e.g., example.com)'
        required: true
        default: ''
  schedule:
    - cron: '0 */12 * * *' # Automated run every 12 hours

jobs:
  recon-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go & Python
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Security Tools
        run: |
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          pip install git+https://github.com/s0md3v/Arjun.git
          echo "/home/runner/go/bin" >> $GITHUB_PATH

      # --- 1. SUBFINDER ---
      - name: Subdomain Discovery
        id: subfinder
        run: |
          subfinder -d ${{ github.event.inputs.target_domain }} -o subdomains.txt || touch subdomains.txt
          if [ -s subdomains.txt ]; then
            echo "count=$(wc -l < subdomains.txt)" >> $GITHUB_OUTPUT
          else
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      - name: Notify Discord (Recon Summary)
        if: steps.subfinder.outputs.count > 0
        run: |
          LIST=$(head -n 20 subdomains.txt | sed 's/"/\\"/g' | tr '\n' '\\n')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -H "Content-Type: application/json" -X POST -d '{
            "username": "Egyxos Recon",
            "content": "✅ **Subfinder Complete**\n**Domain:** ${{ github.event.inputs.target_domain }}\n**Subdomains Found:** ${{ steps.subfinder.outputs.count }}\n**Action Link:** '"$RUN_URL"'\n\n```\n'"$LIST"'\n```"
          }' "${{ secrets.DISCORD_WEBHOOK }}"

      # --- 2. ARJUN (Parameter Recon) ---
      - name: Parameter Discovery
        run: |
          arjun -u https://${{ github.event.inputs.target_domain }} -o arjun_results.json || echo "{}" > arjun_results.json
          
          if [ -s arjun_results.json ] && [ "$(cat arjun_results.json)" != "{}" ]; then
            ARJUN_DATA=$(cat arjun_results.json | sed 's/"/\\"/g' | head -c 500)
            curl -H "Content-Type: application/json" -X POST -d '{
              "username": "Egyxos Recon",
              "content": "💉 **Arjun Parameter Discovery Complete**\n**Target:** ${{ github.event.inputs.target_domain }}\n\n**Hidden Parameters Found (Sample):**\n```json\n'"$ARJUN_DATA"'\n```"
            }' "${{ secrets.DISCORD_WEBHOOK }}"
          fi

      # --- 3. NUCLEI ---
      - name: Vulnerability Scan (Nuclei)
        id: nuclei
        run: |
          if [ -s subdomains.txt ]; then
            # Filter for LIVE hosts to prevent timeout issues
            cat subdomains.txt | httpx -silent -fc 404,500,502,503 -o live_subs.txt || touch live_subs.txt
            
            if [ -s live_subs.txt ]; then
              # Optimized for speed and bypass
              nuclei -l live_subs.txt -severity medium,high,critical -t 3 -rl 50 -c 15 -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36" -o nuclei_results.txt || touch nuclei_results.txt
            else
              touch nuclei_results.txt
            fi
            
            if [ -s nuclei_results.txt ]; then
              echo "count=$(wc -l < nuclei_results.txt)" >> $GITHUB_OUTPUT
              echo "found=true" >> $GITHUB_OUTPUT
            else
              echo "found=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Notify Discord (Nuclei Summary)
        if: steps.nuclei.outputs.found == 'true'
        run: |
          curl -H "Content-Type: application/json" -X POST -d '{
            "username": "Egyxos Recon",
            "content": "🚨 **Vulnerabilities Found!**\n**Domain:** ${{ github.event.inputs.target_domain }}\n**Count:** ${{ steps.nuclei.outputs.count }}\n\n*Sending findings as separate messages...*"
          }' "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Notify Discord (Individual Vulns)
        if: steps.nuclei.outputs.found == 'true'
        run: |
          while IFS= read -r line; do
            CLEAN_LINE=$(echo "$line" | sed 's/"/\\"/g')
            curl -H "Content-Type: application/json" -X POST -d '{
              "username": "Egyxos Alerts",
              "content": "💥 **Vulnerability Found**\n**Domain:** ${{ github.event.inputs.target_domain }}\n\n```\n'"$CLEAN_LINE"'\n```"
            }' "${{ secrets.DISCORD_WEBHOOK }}"
          done < nuclei_results.txt

      # --- 4. FINAL REPORT ---
      - name: Send Final Report
        if: always()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SUB_COUNT=$([ -f subdomains.txt ] && wc -l < subdomains.txt || echo "0")
          VULN_COUNT=$([ -f nuclei_results.txt ] && wc -l < nuclei_results.txt || echo "0")
          
          curl -H "Content-Type: application/json" -X POST -d '{
            "username": "Egyxos Master",
            "content": "🏁 **Scan Process Finished**\n**Target:** ${{ github.event.inputs.target_domain }}\n**Total Subdomains:** '"$SUB_COUNT"'\n**Total Vulnerabilities:** '"$VULN_COUNT"'\n\n📥 **Access Results:** [Download Artifacts]('"$RUN_URL"')"
          }' "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Egyxos-Reports-${{ github.event.inputs.target_domain }}
          path: |
            subdomains.txt
            nuclei_results.txt
            arjun_results.json
