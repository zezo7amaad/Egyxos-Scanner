name: Egyxos Scanner Automation

on:
  workflow_dispatch:
    inputs:
      target_domain:
        description: 'Target domain to scan (e.g., example.com)'
        required: true
        default: 'google.com'
  schedule:
    - cron: '0 */6 * * *' # Automated run every 6 hours

permissions:
  contents: write  # Allows the action to save history back to your repo

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Go & Python
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tools (Subfinder & Nuclei)
        run: |
          sudo apt-get update && sudo apt-get install -y nmap
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          pip install requests
          echo "/home/runner/go/bin" >> $GITHUB_PATH

      - name: Run Subdomain Discovery
        # This uses the domain you type in the GitHub UI
        run: subfinder -d ${{ github.event.inputs.target_domain || 'google.com' }} -o subdomains.txt

      - name: Notify Discord & Compare
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/egyxos_logic.py

      - name: Update History in GitHub
        run: |
          git config --local user.email "bot@egyxos.com"
          git config --local user.name "Egyxos-Bot"
          cp subdomains.txt subdomains_history.txt
          git add subdomains_history.txt
          git commit -m "Scan results for ${{ github.event.inputs.target_domain }}" || echo "No changes"
          git push
