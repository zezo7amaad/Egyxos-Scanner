name: Egyxos Scanner

on:
  workflow_dispatch:
    inputs:
      target_domain:
        description: 'Target domain to scan (e.g., example.com)'
        required: true
        default: 'google.com'
  schedule:
    - cron: '0 */6 * * *' # Automated run every 6 hours

jobs:
  recon-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go & Python
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap chromium-browser
          
      - name: Install Security Tools
        run: |
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install -v github.com/sensepost/gowitness@latest
          pip install git+https://github.com/devanshbatham/paramspider.git
          pip install git+https://github.com/s0md3v/Arjun.git
          echo "/home/runner/go/bin" >> $GITHUB_PATH

      # --- 1. SUBFINDER ---
      - name: Subdomain Discovery
        id: subfinder
        run: |
          subfinder -d ${{ github.event.inputs.target_domain }} -o subdomains.txt || touch subdomains.txt
          if [ -s subdomains.txt ]; then
            COUNT=$(wc -l < subdomains.txt)
            LIST=$(head -n 10 subdomains.txt | tr '\n' ',' | sed 's/,$//')
            curl -H "Content-Type: application/json" -X POST -d '{
              "username": "Egyxos Subfinder",
              "embeds": [{
                "title": "🚀 Subdomains Discovered",
                "description": "Target: **${{ github.event.inputs.target_domain }}**\nTotal Found: **'"$COUNT"'**",
                "color": 3066993,
                "fields": [{"name": "Sample List", "value": "```'"$LIST"'```"}]
              }]
            }' "${{ secrets.DISCORD_WEBHOOK }}"
          fi

      # --- 2. GOWITNESS ---
      - name: Capture Screenshots (GoWitness)
        run: |
          if [ -s subdomains.txt ]; then
            mkdir -p screenshots
            sed 's/^/http:\/\//' subdomains.txt > urls.txt
            sed 's/^/https:\/\//' subdomains.txt >> urls.txt
            # Using 'scan file' with headless chrome
            gowitness scan file -f urls.txt --threads 5 --timeout 15 --screenshot-path ./screenshots/
            SCREENSHOT_COUNT=$(ls -1 screenshots/*.png 2>/dev/null | wc -l || echo "0")
            curl -H "Content-Type: application/json" -X POST -d '{
              "username": "Egyxos Visual",
              "embeds": [{
                "title": "📸 Visual Recon Complete",
                "description": "Captured **'"$SCREENSHOT_COUNT"'** web interface screenshots for the target.",
                "color": 10181046
              }]
            }' "${{ secrets.DISCORD_WEBHOOK }}"
          fi

      # --- 3. PARAMSPIDER ---
      - name: Parameter Discovery (ParamSpider)
        run: |
          paramspider -d ${{ github.event.inputs.target_domain }} || true
          if [ -d "results" ]; then
            grep "http" results/*.txt | head -n 20 > all_params.txt || touch all_params.txt
            if [ -s all_params.txt ]; then
              PARAM_LIST=$(head -n 5 all_params.txt | sed 's/"/\\"/g')
              curl -H "Content-Type: application/json" -X POST -d '{
                "username": "Egyxos ParamSpider",
                "embeds": [{
                  "title": "🔗 Parameters Mining",
                  "description": "Target: **${{ github.event.inputs.target_domain }}**",
                  "color": 15105570,
                  "fields": [{"name": "URL Preview", "value": "```'"$PARAM_LIST"'```"}]
                }]
              }' "${{ secrets.DISCORD_WEBHOOK }}"
            fi
          fi

      # --- 4. ARJUN ---
      - name: Parameter Brute Force (Arjun)
        run: |
          arjun -u https://${{ github.event.inputs.target_domain }} -o arjun_results.json || echo "{}" > arjun_results.json
          if [ -s arjun_results.json ] && [ "$(cat arjun_results.json)" != "{}" ]; then
            ARJUN_DATA=$(cat arjun_results.json | sed 's/"/\\"/g' | head -c 500)
            curl -H "Content-Type: application/json" -X POST -d '{
              "username": "Egyxos Arjun",
              "embeds": [{
                "title": "💉 Hidden Parameters Found",
                "color": 15844367,
                "fields": [{"name": "Findings", "value": "```json\n'"$ARJUN_DATA"'\n```"}]
              }]
            }' "${{ secrets.DISCORD_WEBHOOK }}"
          fi

      # --- 5. NMAP ---
      - name: IP & OS Scanning (Nmap)
        run: |
          if [ -s subdomains.txt ]; then
            sudo nmap -iL subdomains.txt -F -O -sV -T4 -Pn -oN nmap_results.txt || touch nmap_results.txt
            if [ -s nmap_results.txt ]; then
              NMAP_SUMMARY=$(grep -E "Nmap scan report|OS details|Running:|PORT|STATE|SERVICE" nmap_results.txt | head -n 15 | sed 's/"/\\"/g')
              curl -H "Content-Type: application/json" -X POST -d '{
                "username": "Egyxos Nmap",
                "embeds": [{
                  "title": "🖥️ Infra & OS Mapping",
                  "color": 3447003,
                  "fields": [{"name": "Summary", "value": "```'"$NMAP_SUMMARY"'```"}]
                }]
              }' "${{ secrets.DISCORD_WEBHOOK }}"
            fi
          fi

      # --- 6. NUCLEI ---
      - name: Vulnerability Scan (Nuclei)
        run: |
          if [ -s subdomains.txt ]; then
            nuclei -l subdomains.txt -severity medium,high,critical -o nuclei_results.txt || touch nuclei_results.txt
            if [ -s nuclei_results.txt ]; then
              VULN_DATA=$(cat nuclei_results.txt | head -c 1000 | sed 's/"/\\"/g')
              curl -H "Content-Type: application/json" -X POST -d '{
                "username": "Egyxos Nuclei",
                "embeds": [{
                  "title": "🚨 Critical Findings",
                  "color": 15158332,
                  "fields": [{"name": "Alerts", "value": "```'"$VULN_DATA"'```"}]
                }]
              }' "${{ secrets.DISCORD_WEBHOOK }}"
            fi
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Egyxos-PRO-Reports-${{ github.event.inputs.target_domain }}
          path: |
            subdomains.txt
            nuclei_results.txt
            nmap_results.txt
            arjun_results.json
            all_params.txt
            screenshots/
