name: Egyxos Scanner

on:
  workflow_dispatch:
    inputs:
      target_domain:
        description: 'Target domain to scan (e.g., example.com)'
        required: true
        default: 'google.com'
  schedule:
    - cron: '0 */6 * * *' # Automated run every 6 hours

jobs:
  recon-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go & Python
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Security Tools
        run: |
          sudo apt-get update && sudo apt-get install -y nmap
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          pip install arjun paramspider
          echo "/home/runner/go/bin" >> $GITHUB_PATH

      - name: Subdomain Discovery
        id: subfinder
        run: |
          # Use || true to prevent exit code 1 if subfinder finds nothing
          subfinder -d ${{ github.event.inputs.target_domain }} -o subdomains.txt || touch subdomains.txt
          if [ -s subdomains.txt ]; then
            echo "count=$(wc -l < subdomains.txt)" >> $GITHUB_OUTPUT
          else
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      - name: Notify Discord (Subdomains Found)
        if: steps.subfinder.outputs.count > 0
        run: |
          LIST=$(head -n 15 subdomains.txt | tr '\n' ',' | sed 's/,$//')
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "username": "Egyxos Scanner",
                 "embeds": [{
                   "title": "🚀 Subdomain Discovery Complete",
                   "description": "Found **${{ steps.subfinder.outputs.count }}** subdomains for **${{ github.event.inputs.target_domain }}**.",
                   "color": 3066993,
                   "fields": [
                     {"name": "Sample List", "value": "```'"$LIST"'```"}
                   ]
                 }]
               }' "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Parameter Discovery (ParamSpider)
        run: |
          # Ensure results directory exists to prevent grep errors
          mkdir -p results
          paramspider -d ${{ github.event.inputs.target_domain }} --output params.txt || true
          if [ -d "results" ] && [ "$(ls -A results)" ]; then
            grep "http" results/*.txt > all_params.txt || touch all_params.txt
          else
            touch all_params.txt
          fi

      - name: Parameter Brute Force (Arjun)
        run: |
          # Arjun often exits with 1 if no parameters are found; we force success
          arjun -u https://${{ github.event.inputs.target_domain }} -o arjun_results.json || echo "{}" > arjun_results.json

      - name: IP, OS, and Version Scanning (Nmap)
        run: |
          if [ -s subdomains.txt ]; then
            # -Pn is critical as many targets block pings, causing Nmap to exit 1
            sudo nmap -iL subdomains.txt -F -O -sV -T4 -Pn -oN nmap_results.txt || touch nmap_results.txt
          else
            echo "No subdomains to scan with Nmap." > nmap_results.txt
          fi

      - name: Vulnerability Scan (Nuclei)
        id: nuclei
        run: |
          if [ -s subdomains.txt ]; then
            nuclei -l subdomains.txt -severity medium,high,critical -o nuclei_results.txt || touch nuclei_results.txt
            if [ -s nuclei_results.txt ]; then
              echo "vulns_found=true" >> $GITHUB_OUTPUT
            else
              echo "vulns_found=false" >> $GITHUB_OUTPUT
            fi
          else
             echo "vulns_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Notify Discord (Final Results)
        run: |
          if [ -f nmap_results.txt ] && [ -s nmap_results.txt ]; then
            # Escape quotes to prevent JSON payload errors in curl
            NMAP_SUMMARY=$(grep -E "Nmap scan report|OS details|Running:" nmap_results.txt | head -n 15 | sed 's/"/\\"/g')
          else
            NMAP_SUMMARY="No Nmap data available for this target."
          fi
          
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "username": "Egyxos Recon",
                 "embeds": [{
                   "title": "🔍 Advanced Recon Finished",
                   "description": "Scan for **${{ github.event.inputs.target_domain }}** included OS Fingerprinting and Versioning.",
                   "color": 3447003,
                   "fields": [
                     {"name": "IP & OS Summary", "value": "```'"$NMAP_SUMMARY"'```"},
                     {"name": "Full Reports", "value": "Check Github Artifacts for full logs"}
                   ]
                 }]
               }' "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Notify Discord (Vulnerabilities Found)
        if: steps.nuclei.outputs.vulns_found == 'true'
        run: |
          VULN_DATA=$(cat nuclei_results.txt | head -c 1500 | sed 's/"/\\"/g')
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "username": "Egyxos Alerts",
                 "embeds": [{
                   "title": "🚨 Vulnerabilities Detected!",
                   "description": "Issues found on **${{ github.event.inputs.target_domain }}**.",
                   "color": 15158332,
                   "fields": [
                     {"name": "Nuclei Findings", "value": "```'"$VULN_DATA"'```"}
                   ]
                 }]
               }' "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Upload Scan Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Egyxos-Full-Reports-${{ github.event.inputs.target_domain }}
          path: |
            subdomains.txt
            nuclei_results.txt
            nmap_results.txt
            arjun_results.json
            all_params.txt
